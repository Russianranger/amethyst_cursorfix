name: GTNH cursor fix debug APK
on:
  workflow_dispatch:
  push:
    branches: [v3_openjdk]
    paths-ignore:
      - '**.md'
      - 'docs/**'
permissions:
  contents: read
concurrency:
  group: cursorfix-debug-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'Russianranger/amethyst_cursorfix'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout source and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'
      - name: Get upstream JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          github_token: ${{ github.token }}
          repo: AngelAuraMC/angelauramc-openjdk-build
          run_id: 33461312688
          name: jre8-pojav
          path: app_pojavlauncher/src/main/assets/components/jre
          if_no_artifact_found: fail
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '9.6.1'
      - name: Prepare the pinned Android toolchain and language list
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'ndk;27.3.13750724'
          ./scripts/languagelist_updater.sh
          mkdir -p out
          git diff --check
          git submodule status --recursive | tee out/submodules.txt
      - name: Build debug APK and run existing Android lint
        run: gradle :app_pojavlauncher:assembleDebug :app_pojavlauncher:lintDebug --no-daemon --max-workers=2 --stacktrace
      - name: Verify APK package, ARM64 support, and debug signature
        shell: bash
        run: |
          set -euo pipefail
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/Amethyst-GTNH-cursorfix-debug.apk
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/aapt" dump badging out/Amethyst-GTNH-cursorfix-debug.apk | tee out/apk-badging.txt
          grep -q "package: name='org.angelauramc.amethyst.debug'" out/apk-badging.txt
          grep '^native-code:' out/apk-badging.txt | grep -q "'arm64-v8a'"
          "$build_tools/apksigner" verify --verbose --print-certs out/Amethyst-GTNH-cursorfix-debug.apk | tee out/apk-signature.txt
          grep -qi 'd0d0886a0d7e3486e6627f9b8011027fe3c6b0fb09424530b6d7be14f8c2cc33' out/apk-signature.txt
          (cd out && sha256sum Amethyst-GTNH-cursorfix-debug.apk > SHA256SUMS)
          {
            echo "Source commit: $GITHUB_SHA"
            echo "Upstream base: 330c6eae3164df64bdc4828e946a9e62cc5169e4"
            echo "JRE8 run: 33461312688; artifact: 9783581184"
            echo "Package: org.angelauramc.amethyst.debug"
            echo "Signing: upstream checked-in Android debug key; no private release key"
            echo "Device acceptance: pending physical AYN Thor testing"
          } | tee out/BUILD-INFO.txt
          cat out/BUILD-INFO.txt out/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          cp app_pojavlauncher/build/reports/lint-results-debug.* out/
      - name: Upload installable debug APK and verification reports
        uses: actions/upload-artifact@v4
        with:
          name: amethyst-gtnh-cursorfix-debug-${{ github.run_number }}
          path: out/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
