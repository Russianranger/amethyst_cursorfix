name: Verify history import and sync tags
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'Russianranger/amethyst_cursorfix' && github.ref == 'refs/heads/v3_openjdk'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify imported branches and import original upstream tag objects
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/AngelAuraMC/Amethyst-Android.git
          git remote set-url --push upstream DISABLED
          git fetch --no-recurse-submodules upstream 'refs/heads/*:refs/remotes/upstream/*' 'refs/tags/*:refs/tags/*'
          test "$(git rev-parse upstream/v3_openjdk)" = 330c6eae3164df64bdc4828e946a9e62cc5169e4
          git lfs ls-files --all > /tmp/lfs-files.txt
          if [ -s /tmp/lfs-files.txt ]; then
            git lfs fetch --all upstream
            git lfs push --all origin
          fi
          git push --atomic origin --tags
          git ls-remote --heads --tags origin > /tmp/destination-refs.txt
          python3 - <<'PY'
          import subprocess
          remote = dict(line.split()[::-1] for line in open('/tmp/destination-refs.txt'))
          refs = subprocess.check_output(
              ['git', 'for-each-ref', '--format=%(refname) %(objectname)',
               'refs/remotes/upstream/', 'refs/tags/'], text=True)
          checked = 0
          for line in refs.splitlines():
              ref, sha = line.split()
              if ref in ('refs/remotes/upstream/HEAD', 'refs/remotes/upstream/v3_openjdk'):
                  continue
              target = ref.replace('refs/remotes/upstream/', 'refs/heads/', 1)
              assert remote.get(target) == sha, (target, sha, remote.get(target))
              checked += 1
          subprocess.run(['git', 'merge-base', '--is-ancestor',
                          'upstream/v3_openjdk', 'HEAD'], check=True)
          subprocess.run(['git', 'merge-base', '--is-ancestor',
                          '3c9a05e80a9fa92fdbb0e7fe12448f47663b29d0', 'HEAD'], check=True)
          print(f'Verified {checked} unchanged branch/tag refs and both original histories.')
          PY
          # These temporary branches imported historical workflow versions through
          # the connector with workflow-write permission. Keep only the original tags.
          for name in amethyst-legacy-0 edelweiss v3.2.0-release v3.2.0-testing v3.2.0-testing4 v3.2.0-testing5 v3.2.0-testing6 v3.3.0-testing v3.3.1-release v3.3.1.1; do
            ref="refs/heads/import/tag-history/$name"
            actual="$(git ls-remote origin "$ref" | cut -f1)"
            expected="$(git rev-parse "$name^{}")"
            if [ -n "$actual" ]; then
              test "$actual" = "$expected"
              git push origin --delete "import/tag-history/$name"
            fi
          done
          {
            echo "Upstream branches: $(git for-each-ref refs/remotes/upstream/ --format='%(refname)' | wc -l)"
            echo "Imported tags: $(git tag --list | wc -l)"
            echo "Complete imported history and destination initial commit verified."
          } >> "$GITHUB_STEP_SUMMARY"
